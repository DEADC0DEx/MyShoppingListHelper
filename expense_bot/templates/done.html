{% extends "base.html" %}
{% block title %}הושלם{% endblock %}
{% block content %}
<h1>✅ הייבוא הושלם</h1>
<div class="card summary">
  <p><strong>נשמרו {{ saved }} הוצאות</strong> — סה"כ {{ "%.2f"|format(total) }} ₪</p>
  {% if skipped > 0 %}
  <p style="color:#6b7280; margin-top:8px">דולגו {{ skipped }} שורות (כפילויות או בוטלו ידנית)</p>
  {% endif %}
  <hr class="sep">
  <a href="/" class="btn btn-primary">ייבוא נוסף</a>
</div>
{% endblock %}
