<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ניהול הוצאות{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 24px;
      direction: rtl;
    }
    h1 { font-size: 1.5rem; margin-bottom: 20px; color: #1a1a2e; }
    h2 { font-size: 1.1rem; margin-bottom: 12px; color: #333; }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      max-width: 960px;
    }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: .9rem; }
    input[type=file], textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: .9rem;
      font-family: inherit;
    }
    textarea { height: 180px; resize: vertical; }
    .btn {
      display: inline-block;
      padding: 9px 22px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: .95rem;
      font-weight: 600;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; }
    .btn-link { background: none; color: #2563eb; text-decoration: underline; padding: 0; font-size: .9rem; }
    .error { color: #dc2626; background: #fef2f2; border: 1px solid #fca5a5; border-radius: 6px; padding: 10px 14px; margin-bottom: 16px; }
    .sep { border: none; border-top: 1px solid #e5e7eb; margin: 18px 0; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th { background: #f3f4f6; text-align: right; padding: 8px 10px; border-bottom: 2px solid #d1d5db; }
    td { padding: 7px 10px; border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
    tr.duplicate { background: #fafafa; color: #9ca3af; }
    tr.duplicate td { text-decoration: line-through; }
    .badge-dup {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: .75rem;
      font-weight: 600;
      text-decoration: none;
    }
    select { border: 1px solid #ccc; border-radius: 4px; padding: 3px 6px; font-size: .85rem; }
    .summary { font-size: 1rem; line-height: 1.8; }
    .summary strong { color: #16a34a; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
